[project]
name = "ghosthand"
version = "0.1.0"
description = "macOS computer-use agent over the accessibility tree (MCP server + harness + benchmark)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "mcp[cli]<2",
    "pyobjc-framework-applicationservices>=13.0",
    "pyobjc-framework-cocoa>=13.0",
    "pyobjc-framework-quartz>=13.0",
]

[project.scripts]
ghosthand = "ghosthand.harness:main"
ghosthand-server = "ghosthand.server:main"
ghosthand-bench = "ghosthand.bench.run:main"
ghosthand-setup = "ghosthand.permissions:main"
ghosthand-chat = "ghosthand.chat:main"
ghosthand-log = "ghosthand.display:replay_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghosthand"]
