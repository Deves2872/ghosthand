[project]
name = "mac-buddy"
version = "0.1.0"
description = "macOS computer-use agent over the accessibility tree (MCP server + harness + benchmark)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.13.0",
    "mcp[cli]<2",
    "pyobjc-framework-applicationservices>=13.0",
    "pyobjc-framework-cocoa>=13.0",
    "pyobjc-framework-quartz>=13.0",
    "pywhispercpp>=1.5",
    "sounddevice>=0.5",
]

[project.scripts]
mac-buddy = "mac_buddy.harness:main"
mac-buddy-server = "mac_buddy.server:main"
mac-buddy-bench = "mac_buddy.bench.run:main"
mac-buddy-setup = "mac_buddy.permissions:main"
mac-buddy-chat = "mac_buddy.chat:main"
mac-buddy-log = "mac_buddy.display:replay_main"
mac-buddy-app = "mac_buddy.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mac_buddy"]
